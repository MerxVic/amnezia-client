name: Verify VDS client

on:
  push:
    branches:
      - 'codex/**'
  workflow_dispatch:

jobs:
  build-and-test-linux:
    runs-on: ubuntu-22.04
    env:
      QT_VERSION: 6.10.1
      QT_MIRROR: https://mirrors.ocf.berkeley.edu/qt/
    steps:
      - name: Get sources
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 10

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtremoteobjects qt5compat qtshadertools qthttpserver qtwebsockets
          dir: ${{ runner.temp }}
          setup-python: true
          tools: tools_ifw
          set-env: true
          aqtversion: '==3.3.0'
          py7zrversion: '==0.22.*'
          extra: --base ${{ env.QT_MIRROR }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install build dependencies
        run: |
          python -m pip install 'conan==2.28.0'
          sudo apt-get install libxkbcommon-x11-0 libsecret-1-dev

      - name: Build client and tests
        env:
          QT_INSTALL_DIR: ${{ runner.temp }}
          AMNEZIA_BUILD_TESTS: ON
        run: deploy/build.sh --generator Ninja --installer all

      - name: Run bypass-rule test
        run: |
          QT_ROOT="${{ runner.temp }}/Qt/${{ env.QT_VERSION }}/gcc_64"
          export LD_LIBRARY_PATH="$PWD/deploy/build/client/tests:$QT_ROOT/lib:${LD_LIBRARY_PATH:-}"
          export QT_QPA_PLATFORM=offscreen
          ctest --test-dir deploy/build/client/tests --output-on-failure -R '^UiIpModelAndControllerTest$'
